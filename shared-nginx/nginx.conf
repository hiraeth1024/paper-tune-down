# =============================================================================
# Shared Nginx Gateway — 同一 IP 承载多项目
# =============================================================================
# 新增项目步骤：
#   1. 新项目的 docker-compose.yml 定义 named network（如 `project2`）
#   2. 在 shared-nginx/docker-compose.yml 添加 external network
#   3. 在下方添加 location 块
#   4. docker compose up -d 使配置生效
# =============================================================================

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # ==========================================================================
    # Project 1: PaperTune (论文降重助手) — http://110.40.133.106/
    # ==========================================================================
    location /api/ {
        proxy_pass http://papertune-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://papertune-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # Project 2: (模板 — 取消注释并替换 {name})
    # ==========================================================================
    # location /{name}/api/ {
    #     proxy_pass http://{name}-backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # location /{name}/ {
    #     proxy_pass http://{name}-frontend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
