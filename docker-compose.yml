# =============================================================================
# PaperTune — 论文降重助手
# =============================================================================
# 该 compose 文件只包含项目服务，不包含 nginx。
# nginx 由 ../shared-nginx/docker-compose.yml 独立管理，作为多项目共享网关。
# =============================================================================

services:
  papertune-backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: always
    env_file: ./backend/.env
    volumes:
      - backend_data:/app/data
    networks:
      - papertune

  papertune-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://110.40.133.106
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: always
    depends_on:
      - papertune-backend
    networks:
      - papertune

networks:
  papertune:
    name: papertune

volumes:
  backend_data:
